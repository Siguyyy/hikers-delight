name: Hiker's Delight iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Organic Maps source and apply Hiker's Delight layer
        id: prepare
        shell: bash
        run: |
          scripts/prepare_organicmaps.sh
          echo "organicmaps=$RUNNER_TEMP/organicmaps" >> "$GITHUB_OUTPUT"

      - name: Build the real offline-map app
        shell: bash
        working-directory: ${{ steps.prepare.outputs.organicmaps }}
        run: |
          xcodebuild build \
            -workspace xcode/omim.xcworkspace \
            -scheme OMaps \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUNDLE_IDENTIFIER=com.siguyyy.hikersdelight \
            MARKETING_VERSION=0.1.0 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Package unsigned IPA
        working-directory: ${{ steps.prepare.outputs.organicmaps }}
        shell: bash
        run: |
          mkdir -p build/Payload
          app_path="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$app_path"
          cp -R "$app_path" build/Payload/HikersDelight.app
          cd build
          zip -qry HikersDelight-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: hikers-delight-organicmaps-unsigned-ipa
          path: ${{ steps.prepare.outputs.organicmaps }}/build/HikersDelight-unsigned.ipa
          if-no-files-found: error
